name: Materialize doctrinal ontology

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'doctrine/generative-spirit-spectre'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Regenerate derived ontology
        run: |
          python scripts/generate_ontology.py
          python scripts/validate_repository.py

      - name: Commit derived ontology
        run: |
          if git diff --quiet -- ontology.owl; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ontology.owl
          git commit -m "Regenerate ontology projection"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
