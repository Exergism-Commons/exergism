name: Materialize residual autonomy fix

on:
  push:
    branches:
      - doctrine/generative-spirit-spectre

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: doctrine/generative-spirit-spectre
          fetch-depth: 1
      - name: Regenerate and validate ontology
        run: |
          python scripts/generate_ontology.py
          python scripts/validate_repository.py
      - name: Commit derived ontology
        run: |
          if git diff --quiet -- ontology.owl; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ontology.owl
          git commit -m "Regenerate ontology projection"
          git push origin HEAD:doctrine/generative-spirit-spectre
