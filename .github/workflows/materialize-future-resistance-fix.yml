name: Materialize future-resistance relation fix

on:
  push:
    branches:
      - doctrine/generative-spirit-spectre

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: doctrine/generative-spirit-spectre
          fetch-depth: 1
      - name: Patch canonical ontology, regenerate, and validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('content/ontologia.json')
          data = json.loads(path.read_text())

          def find(node, canonical_id):
              if isinstance(node, dict):
                  if node.get('canonical_id') == canonical_id:
                      return node
                  for value in node.values():
                      found = find(value, canonical_id)
                      if found is not None:
                          return found
              elif isinstance(node, list):
                  for value in node:
                      found = find(value, canonical_id)
                      if found is not None:
                          return found
              return None

          future = find(data, 'futuro_representacional')
          if future is None:
              raise SystemExit('futuro_representacional not found')

          apertura = next((f for f in future.get('fields', []) if f.get('key') == 'apertura'), None)
          if apertura is None:
              raise SystemExit('futuro_representacional.apertura not found')

          apertura['role'] = 'relation'
          apertura['value'] = (
              'La resistencia espectral de la trayectoria historica es una dimension relevante '
              'para la amplitud del futuro representacional, junto con la diversidad del corpus '
              'y la pluralidad de custodios e interpretaciones.'
          )
          apertura['target_hints'] = ['resistencia_espectral']
          apertura['target_ids'] = ['resistencia_espectral']

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          python scripts/generate_ontology.py
          python scripts/validate_repository.py
      - name: Commit canonical and derived changes
        run: |
          if git diff --quiet -- content/ontologia.json ontology.owl; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ontologia.json ontology.owl
          git commit -m "Project future openness onto spectral resistance"
          git push origin HEAD:doctrine/generative-spirit-spectre
