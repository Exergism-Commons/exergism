name: Validate canonical corpus

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/validation-requirements.txt

      - name: Validate repository
        run: python scripts/validate_repository.py

      - name: Validate proposal documents
        run: python scripts/validate_proposal_docs.py

      - name: Test proposal validator
        run: python -m unittest scripts/test_validate_proposal_docs.py

      - name: Execute XR-1 realization evidence
        run: python scripts/xr1_witness.py --certificate xr1-evidence.json

      - name: Upload XR-1 realization evidence
        uses: actions/upload-artifact@v4
        with:
          name: xr1-evidence-${{ github.sha }}
          path: xr1-evidence.json
          if-no-files-found: error

      - name: Regenerate ontology and require clean output
        run: |
          python scripts/generate_ontology.py
          git diff --exit-code -- ontology.owl

      - name: Build candidate release manifest
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("manifest.json"))["release"]["version"])')"
          python scripts/build_release_manifest.py \
            --version "$VERSION" \
            --git-commit "$GITHUB_SHA" \
            --output release-manifest.json

      - name: Upload candidate release manifest
        uses: actions/upload-artifact@v4
        with:
          name: exergism-release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
